name: MIearn
options:
  bundleIdPrefix: com.miearn
  deploymentTarget:
    iOS: "16.0"
packages:
  MIearnCore:
    path: ../MIearnCore
targets:
  MIearn:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/audio
        type: folder
      - path: Resources/ios_audio_manifest.json
        optional: true
      - path: ../../app/src/main/assets/content/words_v1.json
    dependencies:
      - package: MIearnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miearn.app.ios
        PRODUCT_NAME: MIearn
        MARKETING_VERSION: "2.32"
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MIearn
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  MIearn:
    build:
      targets:
        MIearn: all
    run:
      config: Debug
    archive:
      config: Release
